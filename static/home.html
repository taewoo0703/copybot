<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Trading Bot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
        }
        label {
            display: flex;
            margin-bottom: 10px;
            align-items: center;
            gap: 10px;
        }
        section {
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #ccc;
        }
        input, button {
            margin-bottom: 10px;
            font-size: 16px;
        }
        #password, #sync-group-id {
            width: 240px;
        }
        #output {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #000;
            background-color: #f9f9f9;
            white-space: pre-wrap;
            font-size: 14px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <h1>Copy Trading Bot</h1>

    <label>Password:
        <input type="password" id="password" placeholder="Enter password">
    </label>

    <section>
        <h2>Debug Console</h2>
        <button data-action="log-trace">Trace</button>
        <button data-action="log-debug">Debug</button>
        <button data-action="log-info">Info</button>
        <button data-action="log-success">Success</button>
        <button data-action="log-warning">Warning</button>
        <button data-action="log-error">Error</button>
        <button data-action="log-critical">Critical</button>
    </section>

    <section>
        <h2>Configuration</h2>
        <button data-action="reload-config">Reload Config</button>
        <button data-action="view-config">View Config</button>
    </section>

    <section>
        <h2>Synchronization</h2>
        <label>Group ID:
            <input type="text" id="sync-group-id" placeholder="Optional">
        </label>
        <button data-action="trigger-sync">Trigger Sync</button>
        <button data-action="view-status">View Status</button>
    </section>

    <section>
        <h2>Output</h2>
        <div id="output">Responses will appear here...</div>
    </section>

    <script src="main.js"></script>
</body>
</html>
